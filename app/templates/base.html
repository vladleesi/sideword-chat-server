<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sideword{% endblock %}</title>
  <link rel="icon" href="/static/mark.svg?v=1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=1">
  <link rel="stylesheet" href="/static/admin.css?v=18">
  <script src="/static/admin-actions.js?v=2" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/admin/"><img src="/static/mark.svg?v=1" width="28" height="28" alt="">Sideword</a>
    {% if admin %}
    <nav>
      <a href="/admin/">Overview</a>
      <a href="/admin/users">Users</a>
      <a href="/admin/links">Links</a>
      <a href="/admin/chats">Chats</a>
      <a href="/admin/export-ui">Export</a>
      <a href="/client">Test client</a>
    </nav>
    <form method="post" action="/admin/logout" class="logout">
    <input type="hidden" name="csrf_token" value="{{ request.state.csrf_token }}">
      <span class="hello">{{ admin.username }}</span>
      <button type="submit">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main class="container {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-description">
    <h2 id="confirm-title">Confirm deletion</h2>
    <p id="confirm-description" class="muted"></p>
    <div class="dialog-actions">
      <button id="confirm-cancel" type="button" autofocus>Cancel</button>
      <button id="confirm-accept" class="danger" type="button">Delete</button>
    </div>
  </dialog>
  <footer class="footer">
    <span>Sideword Server &middot; payloads are encrypted on the client</span>
  </footer>
</body>
</html>
