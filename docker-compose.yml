services:
  sideword:
    build: .
    image: sideword-chat-server:latest
    container_name: sideword-chat-server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sideword-data:/data
      - ./exports:/exports

volumes:
  sideword-data:
    name: sideword-data
