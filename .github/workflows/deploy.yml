name: Deploy backend manually

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    # Promotion/release cannot move the checked main commit during activation.
    concurrency:
      group: promote-main
      cancel-in-progress: false
    env:
      TESTED_SHA: ${{ github.sha }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_ZONE: ${{ secrets.GCP_ZONE }}
      GCP_INSTANCE: ${{ secrets.GCP_INSTANCE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_ARTIFACT_IMAGE: ${{ secrets.GCP_ARTIFACT_IMAGE }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify the checked commit is still current
        id: current
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main develop
          if [ "$(git rev-parse origin/main)" = "$TESTED_SHA" ] && \
             [ "$(git rev-parse origin/develop)" = "$TESTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The selected commit is no longer current; skipping deployment."
          fi
      - name: Verify both CI checks on the exact commit
        id: ci
        if: steps.current.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.deploy ci --sha "$TESTED_SHA"
      - name: Validate deployment configuration
        if: steps.current.outputs.deploy == 'true'
        run: python -m scripts.deploy validate
      - name: Download the verified CI image
        if: steps.current.outputs.deploy == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checked-image-${{ steps.ci.outputs.run_attempt }}
          path: ${{ runner.temp }}/checked-image/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci.outputs.run_id }}
      - name: Verify the CI archive before authentication
        if: steps.current.outputs.deploy == 'true'
        run: python -m scripts.deploy artifact --directory "$RUNNER_TEMP/checked-image" --sha "$TESTED_SHA"
      - name: Authenticate with short-lived Google credentials
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Publish the exact CI image
        if: steps.current.outputs.deploy == 'true'
        run: python -m scripts.deploy publish --directory "$RUNNER_TEMP/checked-image" --sha "$TESTED_SHA"
      - name: Activate the immutable image through IAP
        if: steps.current.outputs.deploy == 'true'
        run: python -m scripts.deploy vm --image-ref "$IMAGE_REF" --sha "$TESTED_SHA" --image-id "$IMAGE_ID" --version "$BACKEND_VERSION"
