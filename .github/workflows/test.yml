name: test

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m compileall -q app scripts tests
      - run: node --check app/static/client.js
      - run: node --check app/static/appearance.js
      - run: node --check app/static/client-protocol.js
      - run: node --check app/static/admin-links.js
      - run: node --check app/static/invite-vault.js
      - run: node --check app/static/link-form.js
      - run: node --check docs/theme.js
      - run: node --test tests/client_retry.test.cjs tests/client_delivery.test.cjs tests/client_message_status.test.cjs tests/client_crypto.test.cjs tests/client_identity.test.cjs tests/client_ui.test.cjs tests/client_theme.test.cjs tests/admin_links.test.cjs tests/invite_vault.test.cjs
      - run: node --test tests/site_theme.test.cjs
      - run: python -m pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and verify the candidate image
        env:
          TESTED_SHA: ${{ github.sha }}
          RETAIN_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: python -m scripts.deploy package --directory "$RUNNER_TEMP/checked-image" --sha "$TESTED_SHA" --retain "$RETAIN_IMAGE"
      - name: Retain the exact CI image for manual deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checked-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checked-image/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  promote:
    name: Promote develop to main
    needs: [smoke, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Fast-forward main to the tested commit
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          git fetch origin main develop
          if [ "$(git rev-parse origin/develop)" != "$TESTED_SHA" ]; then
            echo "develop has advanced; leaving promotion to its newer run."
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "$TESTED_SHA"; then
            echo "main has diverged; merge it into develop and rerun checks."
            exit 1
          fi
          git push origin "$TESTED_SHA:refs/heads/main"

  release:
    name: Publish promoted release
    needs: [smoke, container, promote]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tested_sha: ${{ github.sha }}
