name: test

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install --upgrade 'pip>=26.2.2,<27'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Audit the installed Python dependencies
        run: python -m scripts.security_scan audit
      - name: Retain the Python advisory report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: security-python-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-reports/pip-audit.json
          retention-days: 14
          if-no-files-found: error
      - run: python -m ruff check .
      - run: python -m compileall -q app scripts tests
      - run: node --check app/static/client.js
      - run: node --check app/static/appearance.js
      - run: node --check app/static/client-protocol.js
      - run: node --check app/static/admin-links.js
      - run: node --check app/static/invite-vault.js
      - run: node --check app/static/link-form.js
      - run: node --check docs/theme.js
      - run: node --test tests/client_retry.test.cjs tests/client_connection.test.cjs tests/client_delivery.test.cjs tests/client_message_status.test.cjs tests/client_crypto.test.cjs tests/client_attachments.test.cjs tests/client_identity.test.cjs tests/client_ui.test.cjs tests/client_theme.test.cjs tests/admin_links.test.cjs tests/invite_vault.test.cjs
      - run: node --test tests/site_theme.test.cjs
      - run: python -m pytest

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Build and verify the candidate image
        id: image
        env:
          TESTED_SHA: ${{ github.sha }}
          RETAIN_IMAGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
        run: python -m scripts.deploy package --directory "$RUNNER_TEMP/checked-image" --sha "$TESTED_SHA" --retain "$RETAIN_IMAGE"
      - name: Prepare private scan output
        env:
          SECURITY_IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: python -m scripts.security_scan init --image "$SECURITY_IMAGE_ID"
      - name: Scan OS and application packages at every severity
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
          TRIVY_IGNOREFILE: /dev/null
          TRIVY_IGNORE_UNFIXED: "false"
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ steps.image.outputs.image_id }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          # Collect all severities; the report step enforces High/Critical blocking.
          exit-code: "0"
          format: json
          output: ${{ runner.temp }}/security-raw/trivy.json
          timeout: 15m
          cache: "false"
      - name: Publish findings and enforce the vulnerability gate
        if: always()
        env:
          SECURITY_IMAGE_ID: ${{ steps.image.outputs.image_id }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: python -m scripts.security_scan report --image "$SECURITY_IMAGE_ID"
      - name: Retain sanitized security reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: security-container-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-reports/
          retention-days: 14
          if-no-files-found: error
      - name: Retain the exact CI image for manual deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: checked-image-${{ github.run_attempt }}
          path: ${{ runner.temp }}/checked-image/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  promote:
    name: Promote develop to main
    needs: [smoke, container, codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward main to the tested commit
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          git fetch origin main develop
          if [ "$(git rev-parse origin/develop)" != "$TESTED_SHA" ]; then
            echo "develop has advanced; leaving promotion to its newer run."
            exit 0
          fi
          if ! git merge-base --is-ancestor origin/main "$TESTED_SHA"; then
            echo "main has diverged; merge it into develop and rerun checks."
            exit 1
          fi
          git push origin "$TESTED_SHA:refs/heads/main"

  release:
    name: Publish promoted release
    needs: [smoke, container, codeql, promote]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tested_sha: ${{ github.sha }}
