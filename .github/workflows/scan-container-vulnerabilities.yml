name: Scan container vulnerabilities

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install main's Python audit environment once
        run: |
          python -m pip install --upgrade 'pip>=26.2.2,<27'
          python -m pip install -r requirements-dev.txt
      - name: Select the immutable image or build main once
        id: image
        env:
          SECURITY_IMAGE_REF: ${{ vars.SECURITY_IMAGE_REF }}
        run: python -m scripts.security_scan prepare
      - name: Prepare private scan output
        env:
          SECURITY_IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: python -m scripts.security_scan init --image "$SECURITY_IMAGE_ID"
      - name: Scan OS and application packages at every severity
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: docker
          TRIVY_IGNOREFILE: /dev/null
          TRIVY_IGNORE_UNFIXED: "false"
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ steps.image.outputs.image_id }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: "false"
          # Collect all severities; the report step enforces High/Critical blocking.
          exit-code: "0"
          format: json
          output: ${{ runner.temp }}/security-raw/trivy.json
          timeout: 15m
          cache: "false"
      - name: Publish findings and enforce the vulnerability gate
        if: always()
        env:
          SECURITY_IMAGE_ID: ${{ steps.image.outputs.image_id }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: python -m scripts.security_scan report --image "$SECURITY_IMAGE_ID"
      - name: Audit the installed Python dependencies
        if: ${{ !cancelled() }}
        run: python -m scripts.security_scan audit
      - name: Audit the exact image's Python dependencies
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          SECURITY_IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: python -m scripts.security_scan audit --image "$SECURITY_IMAGE_ID"
      - name: Retain sanitized security reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: security-daily-${{ github.run_attempt }}
          path: ${{ runner.temp }}/security-reports/
          retention-days: 14
          if-no-files-found: error
