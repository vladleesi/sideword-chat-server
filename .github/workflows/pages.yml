name: Publish landing page

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - name: Collect static site files
        run: |
          mkdir _site
          cp docs/index.html docs/site.css docs/theme.js docs/mark.svg docs/.nojekyll docs/social-card.png docs/robots.txt docs/sitemap.xml _site/
          cp -R docs/fonts _site/fonts
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
          include-hidden-files: true
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5.0.1
