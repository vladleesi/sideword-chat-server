name: Daily security scan

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-security-scan
  cancel-in-progress: false

jobs:
  security:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/scan-container-vulnerabilities.yml
